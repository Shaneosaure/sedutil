name: Rust CI

on:
  push:
    branches: ['**']
    tags: ['sedutil-rs-v*']
  pull_request:
  schedule:
    - cron: '37 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets

      - name: Build and package the Windows x64 CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $target = 'x86_64-pc-windows-msvc'
          cargo build --locked --release --target $target
          $exe = "./target/$target/release/sedutil-rs.exe"
          $version = & $exe --version
          & $exe --help
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne ($version -replace '^sedutil-rs ', 'sedutil-rs-v')) {
            throw 'Release tag does not match the binary version'
          }

          $package = Join-Path $env:RUNNER_TEMP 'sedutil-package'
          $dist = Join-Path $env:RUNNER_TEMP 'sedutil-dist'
          New-Item -ItemType Directory -Path $package, $dist | Out-Null
          Copy-Item -Path $exe, 'LICENSE.txt', 'README.md' -Destination $package
          $commit = git rev-parse HEAD
          if ($commit -ne $env:GITHUB_SHA) { throw 'Unexpected build commit' }
          Set-Content -LiteralPath "$package/BUILD-COMMIT.txt" -Value $commit -Encoding ascii
          $archive = "sedutil-rs-windows-x64-$($commit.Substring(0, 12)).zip"
          Compress-Archive -Path "$package/*" -DestinationPath "$dist/$archive"
          $digest = (Get-FileHash -LiteralPath "$dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$dist/SHA256SUMS.txt" -Value "$digest  $archive`n" -Encoding ascii -NoNewline

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: runner.os == 'Windows'
        with:
          name: sedutil-rs-windows-x64
          path: ${{ runner.temp }}/sedutil-dist/
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: RustSec and dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan both Cargo lockfiles with cargo-deny
        shell: bash
        run: |
          version=0.20.2
          digest=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
          package="cargo-deny-$version-x86_64-unknown-linux-musl"
          archive="$RUNNER_TEMP/$package.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --retry 3 --max-time 90 \
            --output "$archive" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$version/$package.tar.gz"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" "$package/cargo-deny"
          deny="$RUNNER_TEMP/$package/cargo-deny"
          "$deny" --locked check
          "$deny" --locked --manifest-path fuzz/Cargo.toml --config deny.toml check

  fuzz:
    name: Fuzz device responses
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install fuzz tooling
        run: |
          rustup toolchain install nightly-2026-11-05 --profile minimal
          cargo install --locked --version 0.13.2 cargo-fuzz
      - name: Fuzz INQUIRY and Discovery 0
        run: |
          mkdir -p fuzz/corpus/device_response
          cargo +nightly-2026-11-05 fetch --locked --manifest-path fuzz/Cargo.toml
          CARGO_NET_OFFLINE=true cargo +nightly-2026-11-05 fuzz run device_response \
            fuzz/corpus/device_response tests/fixtures -- -max_len=2048 -max_total_time=30
          git diff --exit-code -- fuzz/Cargo.lock

  codeql:
    name: CodeQL (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            os: windows-2022
          - language: actions
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the pinned Rust toolchain
        if: matrix.language == 'rust'
        run: cargo --version

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: '/language:${{ matrix.language }}'

  publish:
    name: Publish attested Windows prerelease
    if: github.repository == 'Shaneosaure/sedutil' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/sedutil-rs-v')
    needs: [tests, dependency-audit, fuzz, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sedutil-rs-windows-x64
          path: dist

      - name: Verify the signed tag and the archive
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^sedutil-rs-v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object | select(.type == "tag") | .sha')"
          [[ "$tag_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" |
            jq -e --arg commit "$GITHUB_SHA" --arg tag "$GITHUB_REF_NAME" \
              '.tag == $tag and .object.type == "commit" and .object.sha == $commit and .verification.verified == true' > /dev/null
          archive="sedutil-rs-windows-x64-${GITHUB_SHA:0:12}.zip"
          sha256sum -- "$archive" | cmp - SHA256SUMS.txt

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/sedutil-rs-windows-x64-*.zip

      - name: Publish the tested package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="sedutil-rs-windows-x64-${GITHUB_SHA:0:12}.zip"
          gh release create "$GITHUB_REF_NAME" "dist/$archive" dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --notes 'Windows x64 USB/SCSI alpha. See README.md for supported operations and hardware validation.'
